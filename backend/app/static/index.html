<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RecipeBox</title>
  <meta name="theme-color" content="#c2410c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RecipeBox">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Recipes</h1>
    <button id="addBtn" class="icon-btn" aria-label="Import recipe">＋</button>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="library" class="active"><span>📖</span>Recipes</button>
    <button data-tab="groceries"><span>🛒</span>Groceries</button>
    <button data-tab="settings"><span>⚙️</span>Settings</button>
  </nav>

  <dialog id="importDialog">
    <form method="dialog" id="importForm">
      <h2>Import recipe</h2>
      <label>Link (TikTok, Instagram, YouTube, Pinterest, blog)
        <div class="row">
          <input id="importUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://…">
          <button type="button" id="pasteBtn" class="secondary">Paste</button>
        </div>
      </label>
      <label>…or paste a caption / recipe text
        <textarea id="importText" rows="5"></textarea>
      </label>
      <div class="row end">
        <button value="cancel" class="secondary" formnovalidate>Cancel</button>
        <button value="ok" id="importGo">Import</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
