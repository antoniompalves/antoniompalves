<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Gohan</title>
  <meta name="theme-color" content="#f6f1e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#120d0a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gohan">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Interface: Zen Kaku Gothic New; titles: Fraunces -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <script>try { var t = JSON.parse(localStorage.getItem("theme")) || "gohan"; if (t !== "quente") document.documentElement.dataset.theme = t; } catch (e) { document.documentElement.dataset.theme = "gohan"; }</script>
</head>
<body>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <div id="app">
    <a class="top-brand" href="#/" aria-label="Gohan: início" data-logo></a>
    <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="cupMenu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="m1" d="M5 8h14"/><path class="m2" d="M5 16h14"/></svg><i class="badge" hidden></i></button>
    <header class="topbar">
      <div id="title"></div>
      <button id="addBtn" class="fab" aria-label="Importar receita" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <main id="view"></main>

    <nav class="tabbar glass" aria-label="Secções">
      <span class="lens" aria-hidden="true"></span>
      <button data-tab="library" class="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H5.5A1.5 1.5 0 0 1 4 16.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h4.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
        <span>Receitas</span></button>
      <button data-tab="plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h3M8 17h6"/></svg>
        <span>Plano</span></button>
      <button data-tab="group">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M15.5 5.6a3.2 3.2 0 0 1 0 5.8M17.5 14.2c1.6.6 2.7 2.2 3 4.8"/></svg>
        <span>Grupo</span><i class="badge" hidden></i></button>
      <button data-tab="lists">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L20.5 8H6.1"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
        <span>Compras</span></button>
      <button data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Definições</span></button>
    </nav>
  </div>

  <!-- Bottom sheet: enters from the bottom, leaves to the bottom, follows the finger. -->
  <div id="scrim" class="scrim" hidden></div>
  <section id="importSheet" class="sheet glass glass-thick" role="dialog" aria-modal="true" aria-labelledby="importTitle" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <form id="importForm" novalidate>
      <div class="sheet-head">
        <button type="button" class="text-btn" data-close>Cancelar</button>
        <h2 id="importTitle">Importar receita</h2>
        <button type="submit" class="text-btn strong" id="importGo" disabled>Importar</button>
      </div>
      <div class="sources" aria-hidden="true">
        <span>TikTok</span><span>Instagram</span><span>YouTube</span><span>Pinterest</span><span>Blogues</span>
      </div>
      <label class="field"><span class="field-label">Ligação</span>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
          <input id="importUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
                 placeholder="Cola uma ligação" aria-describedby="urlHint">
          <button type="button" id="pasteBtn" class="pill-btn">Colar</button>
        </div>
        <span id="urlHint" class="hint" aria-live="polite"></span>
      </label>
      <label class="field" id="importShareRow"><span class="field-label">Partilhar com</span>
        <select id="importShare"></select>
      </label>
      <label class="field"><span class="field-label">Ou cola uma legenda ou o texto da receita</span>
        <textarea id="importText" rows="4" placeholder="“Massa com manteiga de alho 🍜 precisas de: 200 g de massa, 4 dentes de alho…”"></textarea>
      </label>
    </form>
  </section>

  <div id="toast" class="glass-dark" role="status" aria-live="polite"></div>
  <script src="/static/motion.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/timers.js"></script>
  <script src="/static/handsfree.js"></script>
  <script src="/static/social.js"></script>
</body>
</html>
